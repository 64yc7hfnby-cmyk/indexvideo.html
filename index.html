<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеогалерея</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0f172a; /* Стильный темно-синий фон */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        
        /* Сетка для двух видеороликов */
        .video-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 2.5rem; 
            max-width: 1100px;
            width: 100%;
        }
        
        .video-box {
            width: 100%;
            background: #000000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid #1e293b;
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
            outline: none;
        }
        
        @media (max-width: 768px) { 
            .video-container { grid-template-columns: 1fr; gap: 1.5rem; } 
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Первое плеер-видео -->
        <div class="video-box">
            <video controls>
                <source src="video1.mp4" type="video/mp4">
                Ваш браузер не поддерживает видео файлы.
            </video>
        </div>
        
        <!-- Второе плеер-видео -->
        <div class="video-box">
            <video controls>
                <source src="video2.mp4" type="video/mp4">
                Ваш браузер не поддерживает видео файлы.
            </video>
        </div>
    </div>

</body>
</html>
